services:
  etf-dashboard:
    build: .
    image: etf-dashboard:latest
    container_name: etf-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - TZ=Asia/Shanghai
    volumes:
      # [默认启用] 持久化标的池缓存文件，断网或重启均可平滑降级使用
      - ./nasdaq_symbols_cache.json:/app/nasdaq_symbols_cache.json

      # [按需开启] 热开发模式：取消以下两行注释，本地修改 HTML 或 Python 代码后直接生效（无需重新 build 镜像）
      - ./server.py:/app/server.py
      - ./static:/app/static
