services:
  cross-etf:
    build: .
    image: cross-etf:latest
    container_name: cross-etf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 容器内接收Docker端口转发；宿主机仅发布到回环地址
      - BIND_ADDRESS=0.0.0.0
      - PORT=8000
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
    volumes:
      # [默认启用] 持久化挂载全部运行数据（标的缓存与历史收盘归档），完美支持原子写入
      - ./data:/app/data

      # 热开发挂载：HTML修改直接生效，server.py修改后重启；app/模块修改后重新build
      - ./server.py:/app/server.py
      - ./static:/app/static
