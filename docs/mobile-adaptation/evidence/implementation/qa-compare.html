<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CrossETF 移动端实现对照</title>
  <style>
    body { margin: 0; padding: 24px; background: #e2e8f0; color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 18px; font-size: 22px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    figure { margin: 0; padding: 16px; border-radius: 14px; background: white; box-shadow: 0 8px 24px rgba(15, 23, 42, .08); }
    figcaption { margin-bottom: 12px; font-weight: 700; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; background: #070d1b; }
  </style>
</head>
<body>
  <h1>CrossETF 手机端：确认 Demo 与正式实现</h1>
  <div class="grid">
    <figure>
      <figcaption>确认 Demo：默认卡片</figcaption>
      <img src="../05-demo-closed.jpg" alt="确认 Demo 默认卡片">
    </figure>
    <figure>
      <figcaption>正式实现：默认卡片</figcaption>
      <img src="01-mobile-closed.jpg" alt="正式实现默认卡片">
    </figure>
    <figure>
      <figcaption>确认 Demo：行内展开</figcaption>
      <img src="../06-demo-expanded.jpg" alt="确认 Demo 行内展开">
    </figure>
    <figure>
      <figcaption>正式实现：行内展开</figcaption>
      <img src="02-mobile-expanded.jpg" alt="正式实现行内展开">
    </figure>
  </div>
</body>
</html>
